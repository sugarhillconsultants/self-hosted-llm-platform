# At most two GPUs, Spot first, On-Demand when Spot has no capacity, and
# removed when nothing is using it: the "scale to zero" is Karpenter
# deleting the node once the vLLM pod is gone (ADR 0010).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels:
        node-role: gpu
        # The NVIDIA device plugin only schedules onto nodes with this label
        # (or NFD's PCI label); there's no NFD in this cluster.
        nvidia.com/gpu.present: "true"
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      # Only pods that tolerate this (vLLM, the device plugin) land here.
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      requirements:
        # Two 24 GB GPU families, both fitting Qwen2.5-7B bf16: g6 = NVIDIA L4
        # (preferred, cheaper), g5 = NVIDIA A10G. Each family x size x zone x
        # Spot/On-Demand is a separate capacity pool; with only g6 in two zones,
        # every pool was empty for 18 minutes (incident #10).
        # xlarge: 4 vCPU / 16 GiB; 2xlarge: 8 / 32.
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["g6", "g5"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["xlarge", "2xlarge"]
        # Both allowed: Karpenter picks the cheaper (Spot) and falls back to
        # On-Demand when Spot capacity is unavailable.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      # Replace any GPU node after a day, so a forgotten one can't age.
      expireAfter: 24h
  # Hard cap on GPUs, whatever is pending. 2 so Phase 3 can show KEDA scaling
  # 0 -> 1 -> 2 -> 0; within the 8-vCPU Spot quota (2 x g6.xlarge).
  limits:
    nvidia.com/gpu: 2
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
