apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: vllm-model
    namespace: llm
    literals:
      - MODEL=Qwen/Qwen2.5-7B-Instruct
      # Exact commit of the weights. Set with: ./scripts/pin-model.sh
      - MODEL_REVISION=SET-ME
      - SERVED_MODEL_NAME=qwen2.5-7b-instruct
