name: test

on:
  push:
    branches: [main]
    paths: ["gateway/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["gateway/**", ".github/workflows/test.yml"]

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Build image
        run: docker build -t gateway:${{ github.sha }} .
